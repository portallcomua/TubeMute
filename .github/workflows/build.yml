name: Build TubeMute Android TV

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Validate project files
        run: |
          test -f app/src/main/res/drawable/tv_banner.png
          test -f app/src/main/res/drawable/ic_launcher.png

          if grep -R -nE 'REPLACE_NS|ВАШ_ЛОГІН' app/src/main; then
            echo "ERROR: Unreplaced placeholder found."
            exit 1
          fi

      - name: Build universal debug APK
        run: gradle --no-daemon clean assembleDebug

      - name: Verify APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"

          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt | sort | tail -n 1)
          "$AAPT" dump badging "$APK" > apk-info.txt
          cat apk-info.txt

          grep -q "package: name='com.custom.reklamoid'" apk-info.txt
          grep -q "sdkVersion:'19'" apk-info.txt

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TubeMute-TV-APK-Android-4.4+
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Prepare permanent signing key
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > app/release.keystore
          test -s app/release.keystore

      - name: Build signed release APK
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          gradle --no-daemon assembleRelease \
            -PRELEASE_STORE_FILE=release.keystore \
            -PRELEASE_STORE_PASSWORD="$RELEASE_STORE_PASSWORD" \
            -PRELEASE_KEY_ALIAS="$RELEASE_KEY_ALIAS" \
            -PRELEASE_KEY_PASSWORD="$RELEASE_KEY_PASSWORD"

      - name: Upload signed release APK
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: TubeMute-TV-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90
