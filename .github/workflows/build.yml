name: Build Signed Release APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Fix XML Namespaces
        run: |
          P1="http"
          D1="schemas"
          D2="android"
          D3="com"
          NS="${P1}://${D1}.${D2}.${D3}/apk/res/${D2}"
          sed -i "s|REPLACE_NS|${NS}|g" app/src/main/AndroidManifest.xml app/src/main/res/drawable/tv_banner_vec.xml
      - name: Generate Release Keystore
        run: |
          keytool -genkey -v -keystore app/release.keystore -alias tubemute -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=TubeMute, OU=TV, O=Custom, L=Kyiv, S=Kyiv, C=UA"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
      - name: Build Release APK
        run: gradle assembleRelease
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: TubeMute-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
