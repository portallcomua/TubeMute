name: TubeMute - Android TV Release and USB installer

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build signed Android TV APK and USB package
    runs-on: ubuntu-latest

    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Require permanent signing key
        shell: bash
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Missing ANDROID_KEYSTORE_BASE64"; exit 1; }
          test -n "$RELEASE_STORE_PASSWORD" || { echo "Missing ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$RELEASE_KEY_ALIAS" || { echo "Missing ANDROID_KEY_ALIAS"; exit 1; }
          test -n "$RELEASE_KEY_PASSWORD" || { echo "Missing ANDROID_KEY_PASSWORD"; exit 1; }

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Validate Android TV resources and manifest
        shell: bash
        run: |
          test -s app/src/main/res/drawable/tv_banner.png
          test -s app/src/main/res/drawable/ic_launcher.png
          grep -q 'android.software.leanback' app/src/main/AndroidManifest.xml
          grep -q 'android.hardware.touchscreen' app/src/main/AndroidManifest.xml
          grep -q 'android:required="false"' app/src/main/AndroidManifest.xml
          grep -q 'android.intent.category.LEANBACK_LAUNCHER' app/src/main/AndroidManifest.xml
          if grep -R -nE 'REPLACE_NS|ВАШ_ЛОГІН' app/src/main; then
            echo "Unreplaced placeholder found."
            exit 1
          fi

      - name: Restore permanent signing key
        shell: bash
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/release.keystore
          test -s app/release.keystore
          keytool -list -keystore app/release.keystore -storepass "$RELEASE_STORE_PASSWORD" -alias "$RELEASE_KEY_ALIAS"

      - name: Build signed Release APK
        shell: bash
        run: |
          gradle --no-daemon clean assembleRelease \
            -PRELEASE_STORE_FILE=release.keystore \
            -PRELEASE_STORE_PASSWORD="$RELEASE_STORE_PASSWORD" \
            -PRELEASE_KEY_ALIAS="$RELEASE_KEY_ALIAS" \
            -PRELEASE_KEY_PASSWORD="$RELEASE_KEY_PASSWORD"

      - name: Verify APK package, version, Android range and signature
        shell: bash
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt | sort | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -n 1)"
          "$AAPT" dump badging "$APK" > apk-info.txt
          grep -q "package: name='com.custom.reklamoid' versionCode='10' versionName='1.7.2'" apk-info.txt
          grep -q "sdkVersion:'19'" apk-info.txt
          grep -q "targetSdkVersion:'28'" apk-info.txt
          grep -q "launchable-activity" apk-info.txt
          "$APKSIGNER" verify --verbose "$APK"
          cat apk-info.txt
          ls -lh "$APK"

      - name: Prepare USB folder with APK at its root
        shell: bash
        run: |
          mkdir -p TubeMute-USB
          cp app/build/outputs/apk/release/app-release.apk TubeMute-USB/TubeMute.apk
          cat > TubeMute-USB/ПРОЧИТАЙТЕ-ПЕРЕД-УСТАНОВКОЮ.txt <<'EOF'
          TUBEMUTE 1.7.2 — ВСТАНОВЛЕННЯ НА ANDROID TV / GOOGLE TV

          1. Скопіюйте файл TubeMute.apk у корінь USB-флешки.
          2. Підключіть флешку до телевізора.
          3. Відкрийте на телевізорі «Файли», «File Manager» або «Медіацентр».
          4. Виберіть TubeMute.apk.
          5. Якщо телевізор попросить дозвіл, відкрийте налаштування цього файлового менеджера
             та дозвольте «Встановлення невідомих програм».
          6. Поверніться до TubeMute.apk і натисніть «Встановити».
          7. Після встановлення відкрийте TubeMute зі списку програм.

          ВАЖЛИВО:
          - Потрібне перше підтвердження встановлення на самому телевізорі.
          - Якщо система повідомляє про конфлікт підпису зі старою тестовою версією,
            стару версію TubeMute потрібно видалити, а потім встановити цю.
          - APK призначений для Android TV, Google TV та Android Smart TV без сенсорного екрана.
          - Мінімальна системна версія APK: Android 4.4 (API 19).
          - Для роботи YouTube потрібен сумісний і оновлений системний Android System WebView.
          - Samsung Tizen та LG webOS не підтримують Android APK.
          EOF
          (cd TubeMute-USB && sha256sum TubeMute.apk > SHA256SUMS.txt)
          zip -j TubeMute-USB-Installer.zip TubeMute-USB/TubeMute.apk TubeMute-USB/ПРОЧИТАЙТЕ-ПЕРЕД-УСТАНОВКОЮ.txt TubeMute-USB/SHA256SUMS.txt
          cp app/build/outputs/apk/release/app-release.apk TubeMute.apk
          sha256sum TubeMute.apk > TubeMute.apk.sha256
          ls -lh TubeMute.apk TubeMute-USB-Installer.zip TubeMute.apk.sha256

      - name: Upload standalone signed APK
        uses: actions/upload-artifact@v4
        with:
          name: TubeMute-1.7.2-APK
          path: |
            TubeMute.apk
            TubeMute.apk.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Upload USB installer ZIP
        uses: actions/upload-artifact@v4
        with:
          name: TubeMute-1.7.2-USB
          path: TubeMute-USB-Installer.zip
          if-no-files-found: error
          retention-days: 90

      - name: Publish downloadable GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.7.2
          name: TubeMute 1.7.2 — Android TV
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          make_latest: true
          files: |
            TubeMute.apk
            TubeMute.apk.sha256
            TubeMute-USB-Installer.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
