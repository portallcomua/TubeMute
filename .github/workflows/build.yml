name: TubeMute - Signed Release and USB installer

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Build signed Release APK and USB package
    runs-on: ubuntu-latest

    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Require permanent signing key
        shell: bash
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Missing ANDROID_KEYSTORE_BASE64"; exit 1; }
          test -n "$RELEASE_STORE_PASSWORD" || { echo "Missing ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$RELEASE_KEY_ALIAS" || { echo "Missing ANDROID_KEY_ALIAS"; exit 1; }
          test -n "$RELEASE_KEY_PASSWORD" || { echo "Missing ANDROID_KEY_PASSWORD"; exit 1; }

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Validate project resources
        shell: bash
        run: |
          test -s app/src/main/res/drawable/tv_banner.png
          test -s app/src/main/res/drawable/ic_launcher.png
          if grep -R -nE 'REPLACE_NS|ВАШ_ЛОГІН' app/src/main; then
            echo "Unreplaced placeholder found."
            exit 1
          fi

      - name: Restore permanent signing key
        shell: bash
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/release.keystore
          test -s app/release.keystore
          keytool -list -keystore app/release.keystore -storepass "$RELEASE_STORE_PASSWORD" -alias "$RELEASE_KEY_ALIAS"

      - name: Build signed Release APK
        shell: bash
        run: |
          gradle --no-daemon clean assembleRelease \
            -PRELEASE_STORE_FILE=release.keystore \
            -PRELEASE_STORE_PASSWORD="$RELEASE_STORE_PASSWORD" \
            -PRELEASE_KEY_ALIAS="$RELEASE_KEY_ALIAS" \
            -PRELEASE_KEY_PASSWORD="$RELEASE_KEY_PASSWORD"

      - name: Verify APK package, Android version and signature
        shell: bash
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt | sort | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -n 1)"
          "$AAPT" dump badging "$APK" > apk-info.txt
          grep -q "package: name='com.custom.reklamoid'" apk-info.txt
          grep -q "sdkVersion:'19'" apk-info.txt
          "$APKSIGNER" verify --verbose "$APK"
          cat apk-info.txt
          ls -lh "$APK"

      - name: Create USB installer folder
        shell: bash
        run: |
          mkdir -p TubeMute-USB-Installer
          cp app/build/outputs/apk/release/app-release.apk TubeMute-USB-Installer/TubeMute.apk
          cat > TubeMute-USB-Installer/INSTALL-ON-TV.txt <<'EOF'
          TUBEMUTE — ВСТАНОВЛЕННЯ З USB-ФЛЕШКИ

          1. Розпакуйте цей комплект на USB-флешку.
          2. Підключіть флешку до USB-порту телевізора.
          3. Відкрийте на телевізорі програму "Файли", "File Manager" або "Медіацентр".
          4. Відкрийте USB-накопичувач і виберіть файл TubeMute.apk.
          5. Якщо Android попросить дозвіл, дозвольте встановлення програм для цього файлового менеджера.
          6. Поверніться до TubeMute.apk і натисніть "Встановити".
          7. Після завершення відкрийте TubeMute зі списку програм.

          ВАЖЛИВО:
          - Це підписана Release-версія, не Debug.
          - Для першого встановлення потрібне підтвердження на екрані телевізора.
          - Якщо оновлення не встановлюється через конфлікт підпису зі старою тестовою версією,
            видаліть стару TubeMute і встановіть цю версію повторно.
          - Не видаляйте tubemute-release.jks: це постійний ключ для всіх майбутніх оновлень.
          - Мінімальна версія Android у цьому APK — 4.4 (API 19). Робота YouTube залежить
            також від версії системного WebView на телевізорі.
          EOF
          cat > TubeMute-USB-Installer/install-via-usb-debugging.bat <<'EOF'
          @echo off
          chcp 65001 >nul
          echo TubeMute USB installer
          echo Connect Android TV to this PC with USB debugging enabled.
          echo.
          where adb >nul 2>nul
          if errorlevel 1 (
            echo ADB not found. Install Android Platform Tools or install TubeMute.apk directly on the TV from USB.
            pause
            exit /b 1
          )
          adb devices
          echo.
          echo If your TV is listed as device, installing TubeMute...
          adb install -r "%~dp0TubeMute.apk"
          if errorlevel 1 (
            echo Installation failed. Check TV authorization and Android settings.
          ) else (
            echo TubeMute installed successfully.
          )
          pause
          EOF
          ls -lah TubeMute-USB-Installer

      - name: Create USB installer ZIP
        run: zip -r TubeMute-USB-Installer.zip TubeMute-USB-Installer

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: TubeMute-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload USB installer package
        uses: actions/upload-artifact@v4
        with:
          name: TubeMute-USB-Installer
          path: TubeMute-USB-Installer.zip
          if-no-files-found: error
          retention-days: 90
