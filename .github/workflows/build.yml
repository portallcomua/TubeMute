name: TubeMute - Android TV and Android build

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: tubemute-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build and verify signed Android APK
    runs-on: ubuntu-latest

    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP for plugin syntax check
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Validate TubeMute WordPress plugin syntax
        run: php -l tubemute-access-api.php

      - name: Require permanent signing key
        shell: bash
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Missing ANDROID_KEYSTORE_BASE64"; exit 1; }
          test -n "$RELEASE_STORE_PASSWORD" || { echo "Missing ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$RELEASE_KEY_ALIAS" || { echo "Missing ANDROID_KEY_ALIAS"; exit 1; }
          test -n "$RELEASE_KEY_PASSWORD" || { echo "Missing ANDROID_KEY_PASSWORD"; exit 1; }

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Validate real PNG resources and Android manifest
        shell: bash
        run: |
          python3 - <<'PY'
          import struct
          from pathlib import Path

          checks = {
              Path("src/main/res/drawable/ic_launcher.png"): (192, 192),
              Path("src/main/res/drawable/tv_banner.png"): (320, 180),
          }
          signature = b"\x89PNG\r\n\x1a\n"
          for path, expected in checks.items():
              data = path.read_bytes()
              if len(data) < 24 or data[:8] != signature or data[12:16] != b"IHDR":
                  raise SystemExit(f"Invalid PNG file: {path}")
              actual = struct.unpack(">II", data[16:24])
              if actual != expected:
                  raise SystemExit(f"Wrong PNG dimensions for {path}: {actual}, expected {expected}")
              print(f"VALID PNG: {path} {actual[0]}x{actual[1]} ({len(data)} bytes)")

          manifest = Path("src/main/AndroidManifest.xml").read_text(encoding="utf-8")
          required = (
              'android:icon="@drawable/ic_launcher"',
              'android:banner="@drawable/tv_banner"',
              'android:name=".MainActivity"',
              'android:exported="true"',
              'android.intent.category.LEANBACK_LAUNCHER',
              'android.intent.category.LAUNCHER',
          )
          for value in required:
              if value not in manifest:
                  raise SystemExit(f"Missing manifest entry: {value}")
          print("Manifest resource references and launcher entries: OK")
          PY

      - name: Restore permanent signing key
        shell: bash
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release.keystore
          test -s release.keystore
          keytool -list -keystore release.keystore -storepass "$RELEASE_STORE_PASSWORD" -alias "$RELEASE_KEY_ALIAS"

      - name: Build unsigned Release APK
        shell: bash
        run: |
          gradle --no-daemon clean assembleRelease
          find build/outputs/apk/release -maxdepth 1 -type f -name '*-unsigned.apk' -print -quit | grep -q .

      - name: Align, sign and verify final APK (zipalign before apksigner)
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          AAPT="$BUILD_TOOLS/aapt"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          UNSIGNED_APK="$(find build/outputs/apk/release -maxdepth 1 -type f -name '*-unsigned.apk' -print -quit)"
          ALIGNED_APK="build/outputs/apk/release/app-release-aligned.apk"
          FINAL_APK="build/outputs/apk/release/TubeMute-2.0.9.apk"
          SIGNED_TMP="build/outputs/apk/release/TubeMute-2.0.9-signed.apk"
          test -x "$AAPT" && test -x "$APKSIGNER" && test -x "$ZIPALIGN"
          test -s "$UNSIGNED_APK"
          # Align the unsigned APK first; sign only the aligned result.
          "$ZIPALIGN" -p -f 4 "$UNSIGNED_APK" "$ALIGNED_APK"
          "$ZIPALIGN" -c -v 4 "$ALIGNED_APK"
          "$APKSIGNER" sign \
            --ks release.keystore \
            --ks-key-alias "$RELEASE_KEY_ALIAS" \
            --ks-pass env:RELEASE_STORE_PASSWORD \
            --key-pass env:RELEASE_KEY_PASSWORD \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled false \
            --out "$SIGNED_TMP" "$ALIGNED_APK"
          mv "$SIGNED_TMP" "$FINAL_APK"
          # Do not rewrite FINAL_APK after signing. Only verify and hash it.
          "$APKSIGNER" verify --verbose --print-certs "$FINAL_APK" 2>&1 | tee apk-signature-report.txt
          grep -Fq "Verified using v1 scheme (JAR signing): true" apk-signature-report.txt
          grep -Fq "Verified using v2 scheme (APK Signature Scheme v2): true" apk-signature-report.txt
          "$ZIPALIGN" -c -v 4 "$FINAL_APK"
          "$AAPT" dump badging "$FINAL_APK" > apk-info.txt
          grep -q "package: name='com.custom.reklamoid' versionCode='22' versionName='2.0.9'" apk-info.txt
          grep -q "sdkVersion:'19'" apk-info.txt
          grep -q "targetSdkVersion:'34'" apk-info.txt
          grep -q "launchable-activity" apk-info.txt
          sha256sum "$FINAL_APK" | tee final-apk.sha256
          cat apk-info.txt
          ls -lh "$FINAL_APK"

      - name: Compare signing certificate with installed v1.7.3
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          OLD_APK="$(mktemp --suffix=.apk)"
          trap 'rm -f "$OLD_APK" old-signature-report.txt new-signature-report.txt old-apk-info.txt' EXIT
          mkdir -p "$RUNNER_TEMP/tubemute-old-release"
          gh release download v1.7.3 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "TubeMute.apk" \
            --dir "$RUNNER_TEMP/tubemute-old-release"
          cp "$RUNNER_TEMP/tubemute-old-release/TubeMute.apk" "$OLD_APK"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt | sort | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs "$OLD_APK" > old-signature-report.txt 2>&1
          "$APKSIGNER" verify --verbose --print-certs build/outputs/apk/release/TubeMute-2.0.9.apk > new-signature-report.txt 2>&1

          echo "=== Installed v1.7.3 signature report ==="
          cat old-signature-report.txt
          echo "=== Candidate 2.0.9 signature report ==="
          cat new-signature-report.txt
          OLD_CERT="$(awk 'tolower($0) ~ /certificate sha-256 digest:/ {print tolower($NF); exit}' old-signature-report.txt)"
          NEW_CERT="$(awk 'tolower($0) ~ /certificate sha-256 digest:/ {print tolower($NF); exit}' new-signature-report.txt)"
          test -n "$OLD_CERT" || { echo "Could not read v1.7.3 signing certificate"; exit 1; }
          test -n "$NEW_CERT" || { echo "Could not read new APK signing certificate"; exit 1; }
          echo "Installed v1.7.3 signer SHA-256: $OLD_CERT"
          echo "New APK signer SHA-256:         $NEW_CERT"
          test "$OLD_CERT" = "$NEW_CERT" || { echo "ERROR: signing certificates differ; update would not preserve the installed app."; exit 1; }

          "$AAPT" dump badging "$OLD_APK" > old-apk-info.txt
          grep -q "package: name='com.custom.reklamoid'" old-apk-info.txt
          grep -q "versionCode='11'" old-apk-info.txt
          grep -q "versionName='1.7.3'" old-apk-info.txt
          echo "PASS: package identity and signing certificate match v1.7.3."

      - name: Prepare USB installer
        shell: bash
        run: |
          mkdir -p TubeMute-USB
          cp build/outputs/apk/release/TubeMute-2.0.9.apk TubeMute-USB/TubeMute.apk
          cat > TubeMute-USB/ПРОЧИТАЙТЕ-ПЕРЕД-УСТАНОВКОЮ.txt <<'EOF'
          TUBEMUTE 2.0.9 — ANDROID TV / GOOGLE TV / ANDROID

          1. Copy TubeMute.apk to the root of a USB drive.
          2. Connect the USB drive to the TV or phone.
          3. Open a file manager and select TubeMute.apk.
          4. If Android asks, allow this file manager to install unknown apps.
          5. Return to the APK and select Install.

          NOTES:
          - Keep the previous TubeMute installation in place when updating.
          - The update must be signed with the same permanent TubeMute signing key.
          - Android 4.4 (API 19) or newer is required.
          - A compatible Android System WebView and internet connection are required.
          - Samsung Tizen and LG webOS do not install Android APK files.
          EOF
          (cd TubeMute-USB && sha256sum TubeMute.apk > SHA256SUMS.txt)
          zip -j TubeMute-USB-Installer.zip TubeMute-USB/TubeMute.apk TubeMute-USB/ПРОЧИТАЙТЕ-ПЕРЕД-УСТАНОВКОЮ.txt TubeMute-USB/SHA256SUMS.txt
          cp build/outputs/apk/release/TubeMute-2.0.9.apk TubeMute.apk
          sha256sum TubeMute.apk > TubeMute.apk.sha256

      - name: Upload standalone signed APK
        uses: actions/upload-artifact@v4
        with:
          name: TubeMute-2.0.9-APK
          path: |
            TubeMute.apk
            TubeMute.apk.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Upload USB installer ZIP
        uses: actions/upload-artifact@v4
        with:
          name: TubeMute-2.0.9-USB
          path: TubeMute-USB-Installer.zip
          if-no-files-found: error
          retention-days: 90

      - name: Publish downloadable GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.9
          name: TubeMute 2.0.9 — Android TV and Android
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          make_latest: true
          files: |
            TubeMute.apk
            TubeMute.apk.sha256
            TubeMute-USB-Installer.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
