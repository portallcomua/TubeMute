plugins {
    id 'com.android.application'
}

android {
    namespace 'com.custom.reklamoid'
    compileSdk 36

    defaultConfig {
        applicationId "com.custom.reklamoid"
        minSdk 19
        targetSdk 34
        versionCode 34
        versionName "2.4.1"
    }

    signingConfigs {
        if (file("${rootDir}/debug.keystore").exists()) {
            debug {
                storeFile file("${rootDir}/debug.keystore")
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }

        release {
            storeFile file(project.findProperty("RELEASE_STORE_FILE") ?: "release.keystore")
            storePassword project.findProperty("RELEASE_STORE_PASSWORD") ?: ""
            keyAlias project.findProperty("RELEASE_KEY_ALIAS") ?: "tubemute"
            keyPassword project.findProperty("RELEASE_KEY_PASSWORD") ?: ""
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }

        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
}
